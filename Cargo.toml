[package]
name = "usbtree"
version = "0.1.3"
edition = "2024"
description = "Cross-platform terminal UI for inspecting the USB device tree"
repository = "https://github.com/gnomeria/usbtree"
homepage = "https://gnomeria.github.io/usbtree"
readme = "README.md"
license = "MIT"
keywords = ["usb", "tui", "cli", "ratatui", "hardware"]
categories = ["command-line-utilities", "hardware-support"]
exclude = [
    ".agents/",
    ".claude/",
    "CLAUDE.md",
    "skills-lock.json",
]

[dependencies]
nusb = "0.2.4"
pci-ids = "0.2.6"
pci-info = "0.4.0"
ratatui = "0.30.2"
usb-ids = "1.2026.6"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys = "0.5"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem",
    "Win32_System_IO", "Win32_System_Ioctl",
] }
